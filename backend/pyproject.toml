[project]
name = "happy-diary-backend"
version = "0.1.0"
description = "Happiness Spiral API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "sqlalchemy",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx2",
    "pyright",
    "pytest",
    "ruff",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
