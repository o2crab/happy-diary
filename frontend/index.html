<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happiness Spiral</title>
    <!-- 描画前に保存済みテーマを反映し、ちらつきを防ぐ。キーは src/design/theme/theme.ts と同じ。 -->
    <script>
      try {
        const theme = localStorage.getItem("happy-diary:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
